<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center;
    background: #1a2340; color: #dce6ff; font: 1.05rem/1.6 "IBM Plex Sans", system-ui, sans-serif; padding: 24px; }
  h1 { font: 800 3rem/1.1 "Bricolage Grotesque", system-ui, sans-serif; margin: 0 0 8px; }
  a { color: #f2c14e; }
</style>
</head>
<body>
  <div>
    <h1>Game over</h1>
    <p>There's nothing at this address.</p>
    <p><a id="home" href="/">Back to all projects</a></p>
  </div>
  <script>
    /* On a project site (username.github.io/repo/) the root is the first path segment. */
    var seg = location.pathname.split("/")[1];
    if (location.hostname.endsWith("github.io") && location.hostname.split(".")[0] !== seg && seg)
      document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
